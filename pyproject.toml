[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "sre-triage-agent"
version = "0.1.0"
description = "Enterprise Incident Triage & Postmortem Commander built with Google ADK"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "SRE Triage Agent Contributors" },
]
dependencies = [
    "google-adk>=1.14.0",
    "google-genai>=1.30.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "mcp>=1.6.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
cloud = [
    "opentelemetry-exporter-gcp-trace>=1.8.0",
    "google-cloud-logging>=3.11.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
sre-triage-server = "server.app:main"
sre-triage-mcp = "sre_triage_agent.mcp_server.ops_mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["sre_triage_agent", "server"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
