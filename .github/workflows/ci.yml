name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, Typecheck, Unit Tests & Offline Evals
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check sre_triage_agent server eval tests

      - name: Type-check with Mypy
        run: mypy sre_triage_agent server

      - name: Run unit test suite
        run: pytest

      - name: Run deterministic offline evaluations
        run: python -m eval.run_evals --mode offline

  container-build:
    name: Verify Production Container Build
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sre-triage-agent:ci .
